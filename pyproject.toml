[project]
name = "kradio"
version = "1.1.4"
description = "A simple kitchen webradio"
authors = [{ name = "micxer", email = "micxer@micxer.de" }]
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "smbus2~=0.6.1",
    "gpiod>=2.0.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mock>=5.1.0",
    "mypy>=1.11.0",
    "python-semantic-release>=9.0.0",
    "pylint>=4.0.6",
]

[tool.uv]
package = true

[project.scripts]
kradio = "kradio.radio:main"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "uv build && bash debian/build_deb.sh"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*.whl", "dist/*.tar.gz", "dist/*.deb"]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^ci:",
    "^chore:",
    "^style:",
]

[tool.pylint.messages_control]
disable = "all"
enable = [
    "W0601",  # undefined-variable (use before assignment)
    "W0604",  # global-at-module-level
    "W0611",  # unused-import
    "W0612",  # unused-variable
    "W0621",  # redefined-outer-name
    "W0622",  # redefined-builtin
    "E0102",  # function/class redefined
    "E0601",  # used-before-assignment
]

[tool.pylint.imports]
ignored-modules = ["gpiod"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
